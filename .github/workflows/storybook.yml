name: Storybook

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".storybook/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

concurrency:
  group: storybook-pages
  cancel-in-progress: true

# Deploying to GitHub Pages requires these permissions. The repo's Pages
# settings (Settings → Pages → "Build and deployment") must be set to
# "GitHub Actions" (not "Deploy from a branch") for this to publish.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build & Publish Storybook
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        # v4 — actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Bun
        # v2 — oven-sh/setup-bun@v2
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build Storybook
        # Project site → https://markacianfrani.github.io/ai-ui/
        env:
          STORYBOOK_BASE_PATH: /ai-ui/
        run: bun run build-storybook

      - name: Setup Pages
        # v6.0.0 — actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload artifact
        # v5.0.0 — actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./storybook-static

      - name: Deploy to GitHub Pages
        # v5.0.0 — actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
